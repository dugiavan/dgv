              <label class="block text-xs font-bold text-gray-500 mb-1">Họ và tên *</label>
              <input type="text" value={fullName} onChange={e => setFullName(e.target.value)}
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Lớp / Khoa</label>
              <select value={departmentId} onChange={e => setDepartmentId(e.target.value)}
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                <option value="">— Chưa xếp lớp —</option>
                {departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Vai trò</label>
              <select value={role} onChange={e => setRole(e.target.value)}
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                <option value="student">🎓 Học sinh</option>
                <option value="teacher">👨‍🏫 Giáo viên</option>
                <option value="admin">🔑 Quản trị viên</option>
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-bold text-gray-500 mb-1">Mật khẩu mới (Bỏ trống nếu không muốn đổi)</label>
              <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)}
                placeholder="Nhập mật khẩu mới từ 6 ký tự..."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary" />
            </div>
          </div>
          <button type="submit"
            class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-2xl transition shadow-md">
            💾 Cập nhật
          </button>
        </form>
      );
    }

    function ImportCSVForm({ onImport }) {
      const [csvText, setCsvText] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onImport(csvText);
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-2">Định dạng file CSV mẫu:</label>
            <pre class="bg-gray-50 p-3 rounded-xl text-xs font-mono border border-gray-100 select-all leading-tight">
              full_name,email,password,department,role{"\n"}
              Nguyễn Văn A,nva@school.edu.vn,mat_khau_123,Lớp 10A1,student{"\n"}
              Trần Thị B,ttb@school.edu.vn,mat_khau_456,Lớp 10A2,student
            </pre>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Dán nội dung CSV của bạn</label>
            <textarea 
              value={csvText}
              onChange={e => setCsvText(e.target.value)}
              placeholder="Dán nội dung CSV tại đây..."
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-xs font-mono h-48 custom-scrollbar"
            />
          </div>
          <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-2xl transition">Import Dữ Liệu</button>
        </form>
      );
    }

    function UserDetailModal({ user, supabaseClient, departments, onClose }) {
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetchUserResults();
      }, []);

      const fetchUserResults = async () => {
        try {
          const { data, error } = await supabaseClient
            .from('results')
            .select('unit, difficulty, score, total, pct, xp_earned, created_at')
            .eq('student_id', user.id)
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) throw error;
          setResults(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const totalXP = results.reduce((sum, r) => sum + (r.xp_earned || 0), 0);
      const avgScore = results.length
        ? Math.round(results.reduce((sum, r) => sum + r.pct, 0) / results.length)
        : 0;

      return (
        <div>
          {/* Header */}
          <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-primary font-extrabold text-2xl">
              {(user.profile?.full_name || user.email || '?')[0].toUpperCase()}
            </div>
            <div>
              <div class="text-xl font-extrabold text-gray-700">{user.profile?.full_name || '—'}</div>
              <div class="text-sm text-gray-400">{user.email}</div>
            </div>
          </div>

          {/* Stats */}
          <div class="grid grid-cols-3 gap-3 mb-5">
            <div class="bg-emerald-50 rounded-2xl p-3 text-center">
              <div class="text-2xl font-extrabold text-primary">{results.length}</div>
              <div class="text-xs text-gray-500 font-bold">Bài đã làm</div>
            </div>
            <div class="bg-yellow-50 rounded-2xl p-3 text-center">
              <div class="text-2xl font-extrabold text-yellow-700">{totalXP}</div>
              <div class="text-xs text-gray-500 font-bold">Tổng XP</div>
            </div>
            <div class="bg-blue-50 rounded-2xl p-3 text-center">
              <div class="text-2xl font-extrabold text-blue-700">{avgScore}%</div>
              <div class="text-xs text-gray-500 font-bold">Điểm TB</div>
            </div>
          </div>

          {/* Results Table */}
          <div class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">20 bài làm gần nhất</div>
          <div class="max-h-60 overflow-y-auto space-y-2 custom-scrollbar">
            {loading && <div class="text-center py-4 text-gray-400">Đang tải...</div>}
            {!loading && results.length === 0 && (
              <div class="text-center py-4 text-gray-400 font-medium">Chưa có bài làm nào</div>
            )}
            {results.map((r, i) => (
              <div key={i} class="flex items-center justify-between bg-gray-50 rounded-2xl px-4 py-2.5">
                <div>
                  <div class="text-sm font-bold text-gray-700">{r.unit}</div>
                  <div class="text-xs text-gray-400">{new Date(r.created_at).toLocaleDateString('vi-VN')}</div>
                </div>
                <div class="flex items-center gap-3 text-xs font-bold">
                  <span class={`px-2.5 py-1 rounded-full ${r.pct >= 80 ? 'bg-emerald-100 text-emerald-700' : r.pct >= 50 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>
                    {r.pct}%
                  </span>
                  <span class="text-gray-400">+{r.xp_earned || 0} XP</span>
                </div>
              </div>
            ))}
          </div>

          <button onClick={onClose} class="w-full mt-5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 rounded-2xl transition">
            Đóng
          </button>
        </div>
      );
    }

    function UserManagementTab({ supabaseClient, showToast }) {
      const [users, setUsers] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterDept, setFilterDept] = useState('all');
      const [filterRole, setFilterRole] = useState('all');
      const [modal, setModal] = useState(null); // null | 'add' | { type: 'edit', user } | { type: 'detail', user } | 'import_csv'

      useEffect(() => {
        fetchUsers();
        fetchDepartments();
      }, []);

      const fetchDepartments = async () => {
        try {
          const { data, error } = await supabaseClient
            .from('departments')
            .select('*')
            .order('name');
          if (error) throw error;
          setDepartments(data || []);
        } catch (err) {
          console.error('Error fetching departments:', err);
        }
      };

      const fetchUsers = async () => {
        setLoading(true);
        try {
          const { data: { users: authUsers }, error } = await supabaseClient.auth.admin.listUsers({
            page: 1,
            perPage: 1000
          });
          if (error) throw error;

          const { data: profiles, error: profileErr } = await supabaseClient
            .from('profiles')
            .select('id, full_name, role, department_id, updated_at');
          if (profileErr) throw profileErr;

          const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));
          const merged = (authUsers || []).map(u => ({
            ...u,
            profile: profileMap[u.id] || null
          }));

          setUsers(merged);
        } catch (err) {
          showToast('Lỗi tải danh sách học sinh: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleCreateUser = async ({ email, password, full_name, role, department_id }) => {
        setLoading(true);
        try {
          const { data, error: authErr } = await supabaseClient.auth.admin.createUser({
            email,
            password,
            email_confirm: true,
            user_metadata: { full_name }
          });
          if (authErr) throw authErr;

          const userId = data.user.id;

          const { error: profileErr } = await supabaseClient
            .from('profiles')
            .insert({
              id: userId,
              full_name,
              role: role || 'student',
              department_id: department_id || null
            });
          if (profileErr) {
            await supabaseClient.auth.admin.deleteUser(userId);
            throw profileErr;
          }

          showToast(`✅ Đã tạo tài khoản: ${email}`);
          setModal(null);
          fetchUsers();
        } catch (err) {
          showToast('Lỗi tạo tài khoản: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteUser = async (userId, displayName) => {
        if (!confirm(`Xóa tài khoản "${displayName}"?\nThao tác này không thể hoàn tác.`)) return;

        setLoading(true);
        try {
          const { error } = await supabaseClient.auth.admin.deleteUser(userId);
          if (error) throw error;

          await supabaseClient.from('profiles').delete().eq('id', userId);

          showToast(`🗑️ Đã xóa tài khoản ${displayName}`);
          fetchUsers();
        } catch (err) {
          showToast('Lỗi xóa tài khoản: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateUser = async (userId, { full_name, role, department_id, newPassword }) => {
        setLoading(true);
        try {
          if (newPassword && newPassword.trim()) {
            const { error } = await supabaseClient.auth.admin.updateUserById(userId, {
              password: newPassword.trim()
            });
            if (error) throw error;
          }

          const { error: profileErr } = await supabaseClient
            .from('profiles')
            .upsert({ id: userId, full_name, role, department_id });
          if (profileErr) throw profileErr;

          showToast('✅ Cập nhật thông tin thành công');
          setModal(null);
          fetchUsers();
        } catch (err) {
          showToast('Lỗi cập nhật: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleImportCSV = async (csvText) => {
        setLoading(true);
        const lines = csvText.trim().split('\n').filter(Boolean);
        if (lines.length <= 1) {
          showToast('File CSV trống hoặc sai định dạng', 'error');
          setLoading(false);
          return;
        }
        
        const header = lines[0].split(',').map(s => s.trim().toLowerCase());
        const fullNameIdx = header.indexOf('full_name');
        const emailIdx = header.indexOf('email');
        const passwordIdx = header.indexOf('password');
        const deptIdx = header.indexOf('department');
        const roleIdx = header.indexOf('role');

        if (fullNameIdx === -1 || emailIdx === -1 || passwordIdx === -1) {
          showToast('Thiếu cột bắt buộc: full_name, email, password', 'error');
          setLoading(false);
          return;
        }

        const rows = lines.slice(1).map(line => {
          const parts = line.split(',').map(s => s.trim());
          return {
            full_name: parts[fullNameIdx] || '',
            email: parts[emailIdx] || '',
            password: parts[passwordIdx] || '',
            department: deptIdx !== -1 ? parts[deptIdx] : '',
            role: roleIdx !== -1 ? parts[roleIdx] : 'student'
          };
        });

        let successCount = 0;
        let errorCount = 0;

        for (const row of rows) {
          if (!row.email || !row.password || !row.full_name) {
            errorCount++;
            continue;
          }
          try {
            const deptObj = departments.find(d => d.name.toLowerCase() === row.department.toLowerCase());
            
            const { data, error: authErr } = await supabaseClient.auth.admin.createUser({
              email: row.email,
              password: row.password,
              email_confirm: true,
              user_metadata: { full_name: row.full_name }
            });
            if (authErr) throw authErr;

            const userId = data.user.id;
            const { error: profileErr } = await supabaseClient
              .from('profiles')
              .insert({
                id: userId,
                full_name: row.full_name,
                role: row.role || 'student',
                department_id: deptObj?.id || null
              });
            if (profileErr) {
              await supabaseClient.auth.admin.deleteUser(userId);
              throw profileErr;
            }
            successCount++;
          } catch (err) {
            console.error('Import row error:', err);
            errorCount++;
          }
        }

        showToast(`Import xong: ${successCount} thành công, ${errorCount} lỗi`);
        setModal(null);
        fetchUsers();
        setLoading(false);
      };

      const handleExportCSV = () => {
        const header = 'ID,Full Name,Email,Role,Department,Created At\n';
        const rows = filteredUsers.map(u => {
          const dept = departments.find(d => d.id == u.profile?.department_id);
          return [
            u.id,
            `"${(u.profile?.full_name || '').replace(/"/g, '""')}"`,
            u.email,
            u.profile?.role || 'student',
            `"${(dept?.name || '').replace(/"/g, '""')}"`,
            u.created_at
          ].join(',');
        }).join('\n');

        const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'student_list.csv');
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredUsers = users.filter(u => {
        const name = u.profile?.full_name?.toLowerCase() || '';
        const email = u.email?.toLowerCase() || '';
        const matchSearch = name.includes(searchQuery.toLowerCase()) 
                         || email.includes(searchQuery.toLowerCase());
        const matchDept = filterDept === 'all' || u.profile?.department_id == filterDept;
        const matchRole = filterRole === 'all' || u.profile?.role === filterRole;
        return matchSearch && matchDept && matchRole;
      });

      return (
        <div class="space-y-6">
          {/* Stats Row */}
          <div class="grid grid-cols-3 gap-6">
            <StatCard icon="👥" value={users.length} label="Tổng người dùng" color="blue" />
            <StatCard icon="🎓" value={users.filter(u => (u.profile?.role || 'student') === 'student').length} label="Tổng học sinh" color="green" />
            <StatCard icon="🔑" value={users.filter(u => u.profile?.role === 'admin').length} label="Quản trị viên" color="purple" />
          </div>

          {/* Filter Bar */}
          <div class="bg-white p-4 rounded-3xl border border-emerald-50 shadow-sm flex gap-3 items-center flex-wrap">
            <input
              type="text"
              placeholder="🔍 Tìm tên hoặc email..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              class="flex-1 min-w-[200px] px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary"
            />
            <select value={filterDept} onChange={e => setFilterDept(e.target.value)}
              class="px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary bg-white">
              <option value="all">📚 Tất cả lớp</option>
              {departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
            <select value={filterRole} onChange={e => setFilterRole(e.target.value)}
              class="px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary bg-white">
              <option value="all">🎭 Tất cả vai trò</option>
              <option value="student">Học sinh</option>
              <option value="teacher">Giáo viên</option>
              <option value="admin">Quản trị</option>
            </select>
            <div class="flex gap-2">
              <button
                onClick={() => setModal('add')}
                class="bg-primary hover:bg-primary-dark text-white font-bold px-4 py-2.5 rounded-2xl shadow-md text-sm transition flex items-center gap-1.5"
              >
                ➕ Thêm học sinh
              </button>
              <button
                onClick={() => setModal('import_csv')}
                class="bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-4 py-2.5 rounded-2xl text-sm transition"
              >
                📥 Import CSV
              </button>
              <button
                onClick={handleExportCSV}
                class="bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold px-4 py-2.5 rounded-2xl text-sm transition"
              >
                📤 Export CSV
              </button>
            </div>
          </div>

          {/* User Table */}
          <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Người dùng</th>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Email</th>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Lớp</th>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Vai trò</th>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Đăng ký</th>
                    <th class="text-left px-6 py-3 font-bold text-gray-500 text-xs uppercase">Hành động</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                  {filteredUsers.length === 0 ? (
                    <tr>
                      <td colspan="6" class="px-6 py-10 text-center text-gray-400 font-bold">
                        Không tìm thấy người dùng nào phù hợp.
                      </td>
                    </tr>
                  ) : (
                    filteredUsers.map(user => {
                      const dept = departments.find(d => d.id == user.profile?.department_id);
                      return (
                        <tr key={user.id} class="hover:bg-gray-50/50 transition">
                          <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                              <div class="w-9 h-9 rounded-full bg-emerald-100 flex items-center justify-center text-primary font-extrabold text-sm">
                                {(user.profile?.full_name || user.email || '?')[0].toUpperCase()}
                              </div>
                              <div>
                                <div class="font-bold text-gray-700">{user.profile?.full_name || '—'}</div>
                                <div class="text-xs text-gray-400 font-mono">{user.id.slice(0, 8)}...</div>
                              </div>
                            </div>
                          </td>
                          <td class="px-6 py-4 text-gray-600 font-medium">{user.email}</td>
                          <td class="px-6 py-4">
                            <span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full text-xs font-bold">
                              {dept?.name || '—'}
                            </span>
                          </td>
                          <td class="px-6 py-4">
                            <span class={`px-2.5 py-1 rounded-full text-xs font-bold
                              ${user.profile?.role === 'admin' ? 'bg-red-100 text-red-700' :
                                user.profile?.role === 'teacher' ? 'bg-purple-100 text-purple-700' :
                                'bg-gray-100 text-gray-600'}`}>
                              {user.profile?.role || 'student'}
                            </span>
                          </td>
                          <td class="px-6 py-4 text-xs text-gray-400 font-medium">
                            {new Date(user.created_at).toLocaleDateString('vi-VN')}
                          </td>
                          <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                              <button
                                onClick={() => setModal({ type: 'detail', user })}
                                class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-3 py-1.5 rounded-xl transition"
                              >
                                📊 Chi tiết
                              </button>
                              <button
                                onClick={() => setModal({ type: 'edit', user })}
                                class="text-xs bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold px-3 py-1.5 rounded-xl transition"
                              >
                                ✏️ Sửa
                              </button>
                              <button
                                onClick={() => handleDeleteUser(user.id, user.profile?.full_name || user.email)}
                                class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-bold px-3 py-1.5 rounded-xl transition"
                              >
                                🗑️ Xóa
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* MODALS */}
          {modal === 'add' && (
            <TabShellModal title="➕ Tạo tài khoản người dùng" onClose={() => setModal(null)}>
              <AddUserForm departments={departments} onSave={handleCreateUser} />
            </TabShellModal>
          )}

          {modal?.type === 'edit' && (
            <TabShellModal title="✏️ Chỉnh sửa thông tin người dùng" onClose={() => setModal(null)}>
              <EditUserForm departments={departments} user={modal.user} onSave={(data) => handleUpdateUser(modal.user.id, data)} />
            </TabShellModal>
          )}

          {modal?.type === 'detail' && (
            <TabShellModal title="📊 Chi tiết kết quả học sinh" onClose={() => setModal(null)}>
              <UserDetailModal user={modal.user} supabaseClient={supabaseClient} departments={departments} onClose={() => setModal(null)} />
            </TabShellModal>
          )}

          {modal === 'import_csv' && (
            <TabShellModal title="📥 Import Danh Sách Bằng CSV" onClose={() => setModal(null)}>
              <ImportCSVForm onImport={handleImportCSV} />
            </TabShellModal>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
