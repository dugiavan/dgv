<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS — Quản lý nội dung học tập Thầy Du Gia Văn</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & SDKs (Bản dev có Babel biên dịch JSX trên trình duyệt) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Quicksand', 'sans-serif'],
          },
          colors: {
            primary: '#4a8c5c',
            'primary-dark': '#3b6f49',
            bg: '#eef6f0',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #eef6f0;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(74, 140, 92, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="font-sans antialiased text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://fgesawwyjidyyfuiiqga.supabase.co";

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [password, setPassword] = useState('');
      const [serviceRoleKey, setServiceRoleKey] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [currentTab, setCurrentTab] = useState('dashboard'); // 'dashboard', 'categories', 'units', 'questions', 'theory'
      const [supabaseClient, setSupabaseClient] = useState(null);

      // Data States
      const [categories, setCategories] = useState([]);
      const [units, setUnits] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [difficultyFilter, setDifficultyFilter] = useState('all');
      const [questionSearch, setQuestionSearch] = useState('');
      const [selectedUnit, setSelectedUnit] = useState(null);
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');
      const [selectedQIds, setSelectedQIds] = useState(new Set());
      const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);
      
      // Loaders & Alerts
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [modal, setModal] = useState(null); // { type: 'add_category'|'edit_category'|'add_unit'|'edit_unit'|'add_question'|'edit_question'|'import_json', data: any }

      useEffect(() => {
        setSelectedQIds(new Set());
      }, [currentTab, selectedUnit]);

      // Theory Editing
      const [theoryContent, setTheoryContent] = useState('');
      const [theorySaveStatus, setTheorySaveStatus] = useState('saved'); // 'saved', 'unsaved', 'saving'
      const saveTimerRef = useRef(null);

      // Session Check on Load
      useEffect(() => {
        const savedKey = localStorage.getItem('cms_service_role_key');
        if (savedKey) {
          try {
            const client = window.supabase.createClient(SUPABASE_URL, savedKey);
            setSupabaseClient(client);
            setServiceRoleKey(savedKey);
            setIsAuthenticated(true);
          } catch (e) {
            localStorage.removeItem('cms_service_role_key');
          }
        }
      }, []);

      // Fetch initial data when authenticated
      useEffect(() => {
        if (isAuthenticated && supabaseClient) {
          fetchData();
        }
      }, [isAuthenticated, supabaseClient]);

      // SortableJS initialization for Categories, Units, Questions
      useEffect(() => {
        if (!isAuthenticated || !supabaseClient) return;

        let sortableCat, sortableUnit, sortableQ;

        if (currentTab === 'categories') {
          const el = document.getElementById('categories-sortable-list');
          if (el) {
            sortableCat = new Sortable(el, {
              handle: '.drag-handle',
              animation: 150,
              onEnd: async () => {
                const items = [...el.querySelectorAll('[data-id]')];
                const updates = items.map((item, index) => ({
                  id: item.dataset.id,
                  sort_order: index + 1,
                }));
                setLoading(true);
                try {
                  for (const item of updates) {
                    await supabaseClient
                      .from('categories')
                      .update({ sort_order: item.sort_order })
                      .eq('id', item.id);
                  }
                  showToast('Đã cập nhật thứ tự danh mục!');
                  fetchData();
                } catch (err) {
                  showToast('Lỗi cập nhật thứ tự: ' + err.message, 'error');
                  setLoading(false);
                }
              }
            });
          }
        }

        if (currentTab === 'units') {
          const el = document.getElementById('units-sortable-list');
          if (el) {
            sortableUnit = new Sortable(el, {
              handle: '.drag-handle',
              animation: 150,
              onEnd: async () => {
                const items = [...el.querySelectorAll('[data-id]')];
                const updates = items.map((item, index) => ({
                  id: item.dataset.id,
                  sort_order: index + 1,
                }));
                setLoading(true);
                try {
                  for (const item of updates) {
                    await supabaseClient
                      .from('units')
                      .update({ sort_order: item.sort_order })
                      .eq('id', item.id);
                  }
                  showToast('Đã cập nhật thứ tự bài học!');
                  fetchData();
                } catch (err) {
                  showToast('Lỗi cập nhật thứ tự: ' + err.message, 'error');
                  setLoading(false);
                }
              }
            });
          }
        }

        if (currentTab === 'questions') {
          const el = document.getElementById('questions-sortable-list');
          if (el) {
            sortableQ = new Sortable(el, {
              handle: '.drag-handle',
              animation: 150,
              onEnd: async () => {
                const items = [...el.querySelectorAll('[data-id]')];
                const updates = items.map((item, index) => ({
                  id: item.dataset.id,
                  sort_order: index + 1,
                }));
                setLoading(true);
                try {
                  for (const item of updates) {
                    await supabaseClient
                      .from('questions')
                      .update({ sort_order: item.sort_order })
                      .eq('id', item.id);
                  }
                  showToast('Đã cập nhật thứ tự câu hỏi!');
                  fetchQuestionsForUnit(selectedUnit.id);
                } catch (err) {
                  showToast('Lỗi cập nhật thứ tự: ' + err.message, 'error');
                  setLoading(false);
                }
              }
            });
          }
        }

        return () => {
          if (sortableCat) sortableCat.destroy();
          if (sortableUnit) sortableUnit.destroy();
          if (sortableQ) sortableQ.destroy();
        };
      }, [currentTab, categories, units, questions, isAuthenticated, supabaseClient]);

      // Keyboard Shortcuts
      useEffect(() => {
        if (!isAuthenticated) return;

        const handleKeyDown = (e) => {
          const tagName = e.target.tagName;
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tagName)) {
            if (e.key === 'Escape') {
              setCommandPaletteOpen(false);
              setModal(null);
              e.target.blur();
            }
            return;
          }

          // Ctrl+K or Cmd+K
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCommandPaletteOpen(prev => !prev);
          }

          // Escape
          if (e.key === 'Escape') {
            e.preventDefault();
            setCommandPaletteOpen(false);
            setModal(null);
          }

          // Alt+1/2/3
          if (e.altKey) {
            if (e.key === '1') {
              e.preventDefault();
              setCurrentTab('dashboard');
            } else if (e.key === '2') {
              e.preventDefault();
              setCurrentTab('categories');
            } else if (e.key === '3') {
              e.preventDefault();
              setCurrentTab('units');
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isAuthenticated]);

      useEffect(() => {
        window.cmsSetModal = setModal;
        return () => {
          delete window.cmsSetModal;
        };
      }, [setModal]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (password !== 'dgv123') {
          setLoginError('Mật khẩu quản trị không đúng');
          return;
        }
        if (!serviceRoleKey.trim()) {
          setLoginError('Vui lòng nhập Service Role Key để có quyền Ghi');
          return;
        }

        try {
          const client = window.supabase.createClient(SUPABASE_URL, serviceRoleKey.trim());
          setSupabaseClient(client);
          localStorage.setItem('cms_service_role_key', serviceRoleKey.trim());
          setIsAuthenticated(true);
          setLoginError('');
        } catch (err) {
          setLoginError('Key không hợp lệ hoặc không khởi tạo được Client');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('cms_service_role_key');
        setSupabaseClient(null);
        setServiceRoleKey('');
        setIsAuthenticated(false);
        setPassword('');
      };

      const fetchData = async () => {
        setLoading(true);
        try {
          const { data: catData, error: catErr } = await supabaseClient
            .from('categories')
            .select('*')
            .order('sort_order', { ascending: true });
          if (catErr) throw catErr;
          setCategories(catData || []);

          const { data: unitData, error: unitErr } = await supabaseClient
            .from('units')
            .select('*')
            .order('sort_order', { ascending: true });
          if (unitErr) throw unitErr;
          setUnits(unitData || []);
        } catch (err) {
          console.error(err);
          showToast('Không tải được dữ liệu từ database: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // CRUD Category
      const handleSaveCategory = async (catId, formData) => {
        setLoading(true);
        try {
          const { error } = await supabaseClient
            .from('categories')
            .upsert({ id: catId, ...formData });
          if (error) throw error;
          showToast('Đã lưu danh mục thành công!');
          setModal(null);
          fetchData();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteCategory = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa danh mục này? Tất cả các bài học thuộc danh mục này sẽ bị xóa!')) return;
        setLoading(true);
        try {
          const { error } = await supabaseClient.from('categories').delete().eq('id', id);
          if (error) throw error;
          showToast('Đã xóa danh mục thành công');
          fetchData();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // CRUD Unit
      const handleSaveUnit = async (unitId, formData) => {
        setLoading(true);
        try {
          const { error } = await supabaseClient
            .from('units')
            .upsert({ id: unitId, ...formData });
          if (error) throw error;
          showToast('Đã lưu bài học thành công!');
          setModal(null);
          fetchData();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteUnit = async (id) => {
        if (!confirm('Xác nhận xóa bài học này? Mọi câu hỏi và lý thuyết kèm theo bài này sẽ bị xóa vĩnh viễn!')) return;
        setLoading(true);
        try {
          const { error } = await supabaseClient.from('units').delete().eq('id', id);
          if (error) throw error;
          showToast('Đã xóa bài học thành công');
          fetchData();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // CRUD Questions
      const fetchQuestionsForUnit = async (unitId) => {
        setDifficultyFilter('all');
        setQuestionSearch('');
        setLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('questions')
            .select('*')
            .eq('unit_id', unitId)
            .eq('is_active', true)
            .order('sort_order', { ascending: true });
          if (error) throw error;
          setQuestions(data || []);
        } catch (err) {
          showToast('Lỗi tải câu hỏi: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleSaveQuestion = async (qId, formData) => {
        try {
          const { error } = await supabaseClient
            .from('questions')
            .upsert({ id: qId || undefined, unit_id: selectedUnit.id, ...formData });
          if (error) throw error;
          showToast('Đã lưu câu hỏi thành công!');
          setModal(null);
          fetchQuestionsForUnit(selectedUnit.id);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleDeleteQuestion = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa câu hỏi này?')) return;
        try {
          // Soft delete bằng cách set is_active = false
          const { error } = await supabaseClient
            .from('questions')
            .update({ is_active: false })
            .eq('id', id);
          if (error) throw error;
          showToast('Đã xóa câu hỏi thành công');
          fetchQuestionsForUnit(selectedUnit.id);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Import/Export JSON
      const handleImportJSON = async (jsonText) => {
        try {
          const parsed = JSON.parse(jsonText);
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          
          // Validate sơ bộ
          for (let q of arr) {
            if (!q.question || !q.answer || !q.type || !q.difficulty) {
              throw new Error('Dữ liệu câu hỏi bị thiếu trường bắt buộc (question, answer, type, difficulty)');
            }
          }

          setLoading(true);
          const rowsToInsert = arr.map(q => ({
            unit_id: selectedUnit.id,
            type: q.type,
            difficulty: q.difficulty,
            question: q.question,
            options: Array.isArray(q.options) ? q.options : [],
            answer: q.answer,
            explanation: q.explanation || '',
            script: q.script || '',
            is_active: true
          }));

          const { error } = await supabaseClient
            .from('questions')
            .insert(rowsToInsert);

          if (error) throw error;
          showToast(`Đã import thành công ${rowsToInsert.length} câu hỏi!`);
          setModal(null);
          fetchQuestionsForUnit(selectedUnit.id);
        } catch (err) {
          alert('Lỗi parse JSON hoặc lỗi Database: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // CRUD Theory (Live auto-save)
      const fetchTheoryForUnit = async (unitId) => {
        setLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('theory')
            .select('content')
            .eq('unit_id', unitId)
            .maybeSingle();
          if (error) throw error;
          setTheoryContent(data ? data.content : '');
          setTheorySaveStatus('saved');
        } catch (err) {
          showToast('Lỗi tải lý thuyết: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const saveTheoryNow = async (content, unitId) => {
        setTheorySaveStatus('saving');
        try {
          const { error } = await supabaseClient
            .from('theory')
            .upsert({ unit_id: unitId, content }, { onConflict: 'unit_id' });
          if (error) throw error;
          setTheorySaveStatus('saved');
        } catch (err) {
          console.error(err);
          setTheorySaveStatus('unsaved');
          showToast('Lỗi tự động lưu lý thuyết: ' + err.message, 'error');
        }
      };

      const handleTheoryChange = (e) => {
        const val = e.target.value;
        setTheoryContent(val);
        setTheorySaveStatus('unsaved');
        
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => {
          saveTheoryNow(val, selectedUnit.id);
        }, 1500);
      };

      const handleInsertMarkdownHelper = (syntax) => {
        const textarea = document.getElementById('theory-editor-area');
        if (!textarea) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        const before = text.substring(0, start);
        const after = text.substring(end, text.length);
        const selected = text.substring(start, end);

        let replacement = '';
        if (syntax === 'bold') replacement = `**${selected || 'chữ đậm'}**`;
        else if (syntax === 'italic') replacement = `*${selected || 'chữ nghiêng'}*`;
        else if (syntax === 'h2') replacement = `\n## ${selected || 'Tiêu đề lớn'}\n`;
        else if (syntax === 'h3') replacement = `\n### ${selected || 'Tiêu đề nhỏ'}\n`;
        else if (syntax === 'quote') replacement = `\n> ${selected || 'Trích dẫn'}\n`;
        else if (syntax === 'code') replacement = `\n\`\`\`javascript\n${selected || '// code'}\n\`\`\`\n`;
        else if (syntax === 'table') replacement = `\n| Cột 1 | Cột 2 |\n|---|---|\n| Giá trị 1 | Giá trị 2 |\n`;

        const newContent = before + replacement + after;
        setTheoryContent(newContent);
        setTheorySaveStatus('unsaved');
        saveTheoryNow(newContent, selectedUnit.id);
      };

      const filteredQuestions = questions
        .filter(q => difficultyFilter === 'all' || q.difficulty === difficultyFilter)
        .filter(q => {
          const term = questionSearch.trim().toLowerCase();
          if (!term) return true;
          return [
            q.question,
            q.answer,
            q.explanation,
            q.script,
            ...(Array.isArray(q.options) ? q.options : [])
          ].some(value => String(value || '').toLowerCase().includes(term));
        });

      if (!isAuthenticated) {
        return (
          <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-xl border border-emerald-100">
              <div class="text-center mb-6">
                <span class="text-5xl">🌿</span>
                <h1 class="text-2xl font-bold text-primary mt-2">CMS Quản lý nội dung</h1>
                <p class="text-xs text-gray-400 mt-1">Dành cho Thầy Du Gia Văn soạn bài tập</p>
              </div>
              <form onSubmit={handleLogin} class="space-y-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-600 mb-1">Mật khẩu soạn thảo (DGV)</label>
                  <input 
                    type="password" 
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="Mật khẩu CMS..." 
                    class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-600 mb-1 flex justify-between">
                    <span>Supabase Service Role Key</span>
                    <a href="https://supabase.com/dashboard/project/fgesawwyjidyyfuiiqga/settings/api" target="_blank" class="text-xs text-emerald-600 hover:underline">Lấy Key ↗</a>
                  </label>
                  <input 
                    type="password" 
                    value={serviceRoleKey}
                    onChange={e => setServiceRoleKey(e.target.value)}
                    placeholder="eyJhbGciOiJIUzI1NiIsIn..." 
                    class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition text-xs"
                  />
                  <p class="text-[10px] text-red-500 mt-1">⚠️ Cảnh báo: Sử dụng key này cho phép ghi đè database hoàn toàn.</p>
                </div>
                {loginError && <p class="text-sm text-red-500 font-medium">{loginError}</p>}
                <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-2xl shadow-lg transition">
                  Kết nối Database ✨
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="flex h-screen overflow-hidden">
          {/* Toast Notification */}
          {toast && (
            <div class={`fixed bottom-6 right-6 px-5 py-3 rounded-2xl shadow-xl text-white font-semibold z-50 flex items-center gap-2 transition-all ${toast.type === 'error' ? 'bg-red-500' : 'bg-primary'}`}>
              <span>{toast.type === 'error' ? '❌' : '✅'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* Sidebar */}
          <aside class="w-64 bg-white border-r border-emerald-50 flex flex-col">
            <div class="p-6 border-b border-emerald-50 flex items-center gap-3">
              <span class="text-3xl">🌿</span>
              <div>
                <div class="font-bold text-primary">DGV CMS</div>
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Hệ thống bài giảng</div>
              </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2">
              <button 
                onClick={() => setCurrentTab('dashboard')}
                class={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition ${currentTab === 'dashboard' ? 'bg-bg text-primary' : 'text-gray-500 hover:bg-gray-50'}`}
              >
                <span>📊</span> Dashboard
              </button>
              <button 
                onClick={() => setCurrentTab('categories')}
                class={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition ${currentTab === 'categories' ? 'bg-bg text-primary' : 'text-gray-500 hover:bg-gray-50'}`}
              >
                <span>📁</span> Danh Mục (Category)
              </button>
              <button 
                onClick={() => setCurrentTab('units')}
                class={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition ${currentTab === 'units' ? 'bg-bg text-primary' : 'text-gray-500 hover:bg-gray-50'}`}
              >
                <span>📘</span> Bài Học (Units)
              </button>
              <button 
                onClick={() => setCurrentTab('flashcards')}
                class={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition ${currentTab === 'flashcards' ? 'bg-bg text-primary' : 'text-gray-500 hover:bg-gray-50'}`}
              >
                <span>📇</span> Flashcard
              </button>
              <button

                    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white rounded-2xl px-6 py-3 flex items-center gap-4 shadow-2xl z-50">
                      <span class="font-bold text-sm">Đã chọn {selectedQIds.size} câu</span>

                        onChange={async (e) => {
                          const newDiff = e.target.value;
                          if (!newDiff) return;
                          setLoading(true);
                          try {
                            for (const id of selectedQIds) {
                              await supabaseClient
                                .from('questions')
                                .update({ difficulty: newDiff })
                                .eq('id', id);
                            }
                            setSelectedQIds(new Set());
                            fetchQuestionsForUnit(selectedUnit.id);
                            showToast(`Đã đổi độ khó thành công!`);
                          } catch (err) {
                            showToast('Lỗi thay đổi độ khó: ' + err.message, 'error');
                            setLoading(false);
                          }
                        }}
                        class="bg-gray-700 text-white px-3 py-1.5 rounded-xl text-sm font-bold border-none outline-none"
                      >
                        <option value="">Đổi độ khó...</option>

                        <option value="medium">🌿 Vừa</option>
                        <option value="hard">🌳 Khó</option>

                        onClick={async () => {

                          setLoading(true);
                          try {
                            for (const id of selectedQIds) {
                              await supabaseClient
                                .from('questions')
                                .update({ is_active: false })
                                .eq('id', id);
                            }
                            setSelectedQIds(new Set());
                            fetchQuestionsForUnit(selectedUnit.id);
                            showToast(`Đã xóa ${selectedQIds.size} câu hỏi`);
                          } catch (err) {
                            showToast('Lỗi xóa câu hỏi: ' + err.message, 'error');

                          }

                      >
                        🗑️ Xóa tất cả

                  </div>
                </div>
              )}

              {currentTab === 'flashcards' && !loading && (
                <TabFlashcards supabaseClient={supabaseClient} showToast={showToast} />

              {currentTab === 'blog' && !loading && (

                    {modal.type === 'add_unit' && '➕ Thêm Bài Học Mới'}
                    {modal.type === 'edit_unit' && '✏️ Chỉnh Sửa Bài Học'}
                    {modal.type === 'add_question' && '➕ Thêm Câu Hỏi Mới'}

    // Component Form: Question
    function QuestionForm({ initialData, onSave }) {
      const [type, setType] = useState(initialData?.type || 'multiple_choice');
      const [difficulty, setDifficulty] = useState(initialData?.difficulty || 'medium');
      const [question, setQuestion] = useState(initialData?.question || '');
      const [optionsInput, setOptionsInput] = useState(initialData?.options ? initialData.options.join('\n') : '');
      const [answer, setAnswer] = useState(initialData?.answer || '');
      const [explanation, setExplanation] = useState(initialData?.explanation || '');
      const [script, setScript] = useState(initialData?.script || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!question.trim() || !answer.trim()) {
          alert('Câu hỏi và đáp án không được để trống');
          return;
        }

        let options = [];
        if (type === 'multiple_choice') {
          options = optionsInput.split('\n').map(o => o.trim()).filter(o => o);
          if (options.length < 2) {
            alert('Trắc nghiệm cần nhập ít nhất 2 lựa chọn');
            return;
          }
          if (!options.includes(answer.trim())) {
            alert('Đáp án đúng phải nằm trong các lựa chọn');
            return;
          }
        }

        onSave({
          type,
          difficulty,
          question: question.trim(),
          options: type === 'multiple_choice' ? options : [],
          answer: answer.trim(),
          explanation: explanation.trim(),
          script: type === 'listening' ? script.trim() : ''
        });
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Loại câu hỏi</label>
              <select 
                value={type} 
                onChange={e => setType(e.target.value)}
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold"
              >
                <option value="multiple_choice">🔘 Trắc nghiệm</option>
                <option value="fill_blank">✍️ Điền từ vào chỗ trống</option>
                <option value="listening">🔊 Nghe & Trả lời</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Độ khó</label>
              <select 
                value={difficulty} 
                onChange={e => setDifficulty(e.target.value)}
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold"
              >
                <option value="easy">🌱 Dễ (Easy)</option>
                <option value="medium">🌿 Vừa (Medium)</option>
                <option value="hard">🌳 Khó (Hard)</option>
              </select>
            </div>
          </div>

          {type === 'listening' && (
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Đoạn hội thoại TTS (Phát âm giọng đọc AI)</label>
              <input 
                type="text" 
                value={script}
                onChange={e => setScript(e.target.value)}
                placeholder="ví dụ: He plays tennis every afternoon."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold"
              />
            </div>
          )}

          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Nội dung câu hỏi (Dùng ___ cho chỗ trống)</label>
            <textarea 
              value={question}
              onChange={e => setQuestion(e.target.value)}
              placeholder="ví dụ: She ___ (go) to school by bus."
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold h-16"
            />
          </div>

          {type === 'multiple_choice' && (
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">Các phương án lựa chọn (Nhập mỗi dòng một phương án)</label>
              <textarea 
                value={optionsInput}
                onChange={e => setOptionsInput(e.target.value)}
                placeholder="go&#10;goes&#10;going&#10;went"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold font-mono h-24"
              />
            </div>
          )}

          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Đáp án chính xác</label>
            <input 
              type="text" 
              value={answer}
              onChange={e => setAnswer(e.target.value)}
              placeholder="ví dụ: goes"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Giải thích đáp án (Nếu có)</label>
            <textarea 
              value={explanation}
              onChange={e => setExplanation(e.target.value)}
              placeholder="Chủ ngữ 'she' là ngôi thứ 3 số ít nên động từ 'go' cần thêm 'es'..."
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-sm font-semibold h-16"
            />
          </div>

          <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-2xl transition">Lưu Câu Hỏi</button>
        </form>
      );
    }

    // Component Form: Import JSON
    function ImportJSONForm({ onImport }) {
      const [jsonText, setJsonText] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onImport(jsonText);
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Dán khối JSON câu hỏi của bạn</label>
            <textarea 
              value={jsonText}
              onChange={e => setJsonText(e.target.value)}
              placeholder='[&#10;  {&#10;    "type": "multiple_choice",&#10;    "difficulty": "medium",&#10;    "question": "He ___ football now.",&#10;    "options": ["play", "plays", "playing", "is playing"],&#10;    "answer": "is playing",&#10;    "explanation": "Có now chia HTTD"&#10;  }&#10;]'
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary text-xs font-mono h-48 custom-scrollbar"
            />
          </div>
          <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-2xl transition">Import Dữ Liệu</button>
        </form>
      );
    }

    function slugifyText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function TabShellModal({ title, children, onClose }) {
      return (
        <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div class="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl my-8">
            <div class="flex items-center justify-between mb-5">
              <h3 class="text-lg font-extrabold text-gray-700">{title}</h3>
              <button onClick={onClose} class="text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function TabFlashcards({ supabaseClient, showToast }) {
      const emptyTopic = { id: '', title: '', description: '', icon: '📇', sort_order: 0, is_published: true };
      const emptyCard = { english: '', phonetic: '', vietnamese: '', type: 'vocabulary', sort_order: 0 };
      const [topics, setTopics] = useState([]);
      const [cards, setCards] = useState([]);
      const [selectedTopic, setSelectedTopic] = useState(null);
      const [loadingTab, setLoadingTab] = useState(false);
      const [modal, setModal] = useState(null);
      const [importText, setImportText] = useState('');

      useEffect(() => { fetchTopics(); }, []);
      useEffect(() => { if (selectedTopic) fetchCards(selectedTopic.id); }, [selectedTopic?.id]);

      const fetchTopics = async () => {
        setLoadingTab(true);
        const { data, error } = await supabaseClient
          .from('flashcard_topics')
          .select('*')
          .order('sort_order', { ascending: true });
        setLoadingTab(false);
        if (error) return showToast(error.message, 'error');
        setTopics(data || []);
      };

      const fetchCards = async (topicId) => {
        const { data, error } = await supabaseClient
          .from('flashcards')
          .select('*')
          .eq('topic_id', topicId)
          .order('sort_order', { ascending: true });
        if (error) return showToast(error.message, 'error');
        setCards(data || []);
      };

      const syncCardCount = async (topicId, nextCount) => {
        await supabaseClient.from('flashcard_topics').update({ card_count: nextCount }).eq('id', topicId);
        setTopics(prev => prev.map(t => t.id === topicId ? { ...t, card_count: nextCount } : t));
        setSelectedTopic(prev => prev && prev.id === topicId ? { ...prev, card_count: nextCount } : prev);
      };

      const saveTopic = async (topic) => {
        const row = {
          ...topic,
          id: topic.id.trim(),
          title: topic.title.trim(),
          sort_order: Number(topic.sort_order || 0),
          card_count: Number(topic.card_count || 0)
        };
        const { error } = await supabaseClient.from('flashcard_topics').upsert(row);
        if (error) return showToast(error.message, 'error');
        showToast('Đã lưu topic flashcard');
        setModal(null);
        fetchTopics();
      };

      const saveCard = async (card) => {
        const row = {
          ...card,
          topic_id: selectedTopic.id,
          english: card.english.trim(),
          vietnamese: card.vietnamese.trim(),
          phonetic: card.phonetic || null,
          sort_order: Number(card.sort_order || 0)
        };
        const { error } = await supabaseClient.from('flashcards').upsert(row);
        if (error) return showToast(error.message, 'error');
        showToast('Đã lưu thẻ');
        setModal(null);
        const next = await supabaseClient.from('flashcards').select('*', { count: 'exact', head: true }).eq('topic_id', selectedTopic.id);
        await syncCardCount(selectedTopic.id, next.count || cards.length + 1);
        fetchCards(selectedTopic.id);
      };

      const deleteTopic = async (topic) => {
        if (!confirm(`Xóa topic "${topic.title}" và toàn bộ thẻ bên trong?`)) return;
        const { error } = await supabaseClient.from('flashcard_topics').delete().eq('id', topic.id);
        if (error) return showToast(error.message, 'error');
        setSelectedTopic(null);
        showToast('Đã xóa topic');
        fetchTopics();
      };

      const deleteCard = async (cardId) => {
        if (!confirm('Xóa thẻ này?')) return;
        const { error } = await supabaseClient.from('flashcards').delete().eq('id', cardId);
        if (error) return showToast(error.message, 'error');
        const nextCount = Math.max(0, cards.length - 1);
        await syncCardCount(selectedTopic.id, nextCount);
        fetchCards(selectedTopic.id);
      };

      const importCards = async () => {
        try {
          let rows;
          const trimmed = importText.trim();
          if (!trimmed) return;
          if (trimmed.startsWith('[')) {
            rows = JSON.parse(trimmed);
          } else {
            const lines = trimmed.split(/\r?\n/).filter(Boolean);
            rows = lines.map(line => {
              const [english, phonetic, vietnamese, type] = line.split(',').map(x => x.trim());
              return { english, phonetic, vietnamese, type: type || 'vocabulary' };
            });
          }
          const payload = rows.map((card, index) => ({
            topic_id: selectedTopic.id,
            english: card.english,
            phonetic: card.phonetic || null,
            vietnamese: card.vietnamese,
            type: card.type || 'vocabulary',
            sort_order: Number(card.sort_order ?? cards.length + index + 1)
          })).filter(card => card.english && card.vietnamese);
          if (payload.length === 0) throw new Error('Không có thẻ hợp lệ để import');
          const { error } = await supabaseClient.from('flashcards').insert(payload);
          if (error) throw error;
          await syncCardCount(selectedTopic.id, cards.length + payload.length);
          setImportText('');
          setModal(null);
          showToast(`Đã import ${payload.length} thẻ`);
          fetchCards(selectedTopic.id);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const exportCards = () => {
        const payload = cards.map(({ english, phonetic, vietnamese, type }) => ({ english, phonetic, vietnamese, type }));
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${selectedTopic.id}-flashcards.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div class="grid grid-cols-[320px_1fr] gap-6">
          <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-4 h-[calc(100vh-170px)] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-extrabold text-gray-700">Topics</h3>
              <button onClick={() => setModal({ type: 'topic', data: emptyTopic })} class="bg-primary text-white px-3 py-2 rounded-2xl text-xs font-bold">+ Topic</button>
            </div>
            {loadingTab ? <div class="text-sm text-gray-400 font-bold">Đang tải...</div> : topics.map(topic => (
              <button key={topic.id} onClick={() => setSelectedTopic(topic)} class={`w-full text-left p-3 rounded-2xl mb-2 border transition ${selectedTopic?.id === topic.id ? 'bg-emerald-50 border-primary/30' : 'bg-gray-50 border-transparent hover:bg-gray-100'}`}>
                <div class="flex items-center gap-2">
                  <span class="text-2xl">{topic.icon || '📇'}</span>
                  <div class="min-w-0">
                    <div class="font-extrabold text-sm text-gray-700 truncate">{topic.title}</div>
                    <div class="text-[11px] text-gray-400 font-bold">{topic.card_count || 0} thẻ · {topic.is_published ? 'Published' : 'Draft'}</div>
                  </div>
                </div>
              </button>
            ))}
          </div>

          <div class="space-y-4">
            {!selectedTopic ? (
              <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-12 text-center text-gray-400 font-bold">Chọn một topic để quản lý thẻ.</div>
            ) : (
              <>
                <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-4 flex items-center justify-between">
                  <div>
                    <div class="text-xs font-bold text-gray-400">Topic đang chọn</div>
                    <h3 class="text-xl font-extrabold text-gray-700">{selectedTopic.icon} {selectedTopic.title}</h3>
                    <p class="text-xs text-gray-500">{selectedTopic.description}</p>
                  </div>
                  <div class="flex gap-2">
                    <button onClick={() => setModal({ type: 'topic', data: selectedTopic })} class="bg-gray-100 px-4 py-2 rounded-2xl text-xs font-bold">Sửa topic</button>
                    <button onClick={() => deleteTopic(selectedTopic)} class="bg-red-50 text-red-600 px-4 py-2 rounded-2xl text-xs font-bold">Xóa topic</button>
                    <button onClick={() => setModal({ type: 'import' })} class="bg-blue-50 text-blue-600 px-4 py-2 rounded-2xl text-xs font-bold">Import</button>
                    <button onClick={exportCards} class="bg-gray-100 px-4 py-2 rounded-2xl text-xs font-bold">Export JSON</button>
                    <button onClick={() => setModal({ type: 'card', data: { ...emptyCard, sort_order: cards.length + 1 } })} class="bg-primary text-white px-4 py-2 rounded-2xl text-xs font-bold">+ Thẻ</button>
                  </div>
                </div>

                <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm overflow-hidden">
                  <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-xs text-gray-400 uppercase">
                      <tr><th class="text-left p-3">English</th><th class="text-left p-3">Phonetic</th><th class="text-left p-3">Vietnamese</th><th class="text-left p-3">Type</th><th class="p-3"></th></tr>
                    </thead>
                    <tbody>
                      {cards.map(card => (
                        <tr key={card.id} class="border-t border-gray-50">
                          <td class="p-3 font-bold text-gray-700">{card.english}</td>
                          <td class="p-3 text-gray-500">{card.phonetic}</td>
                          <td class="p-3 text-gray-600">{card.vietnamese}</td>
                          <td class="p-3"><span class="bg-emerald-50 text-primary px-2 py-1 rounded-full text-[10px] font-bold">{card.type}</span></td>
                          <td class="p-3 text-right">
                            <button onClick={() => setModal({ type: 'card', data: card })} class="text-blue-600 text-xs font-bold mr-3">Sửa</button>
                            <button onClick={() => deleteCard(card.id)} class="text-red-600 text-xs font-bold">Xóa</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  {cards.length === 0 && <div class="p-10 text-center text-gray-400 font-bold">Topic này chưa có thẻ.</div>}
                </div>
              </>
            )}
          </div>

          {modal?.type === 'topic' && <FlashcardTopicModal data={modal.data} onClose={() => setModal(null)} onSave={saveTopic} />}
          {modal?.type === 'card' && <FlashcardCardModal data={modal.data} onClose={() => setModal(null)} onSave={saveCard} />}
          {modal?.type === 'import' && (
            <TabShellModal title="Import Flashcards" onClose={() => setModal(null)}>
              <textarea value={importText} onChange={e => setImportText(e.target.value)} class="w-full h-64 font-mono text-xs border border-gray-200 rounded-2xl p-4 focus:outline-none focus:ring-2 focus:ring-primary" placeholder='JSON array hoặc CSV: english,phonetic,vietnamese,type' />
              <button onClick={importCards} class="mt-4 w-full bg-primary text-white font-bold py-3 rounded-2xl">Import</button>
            </TabShellModal>
          )}
        </div>
      );
    }

    function FlashcardTopicModal({ data, onClose, onSave }) {
      const [form, setForm] = useState(data);
      const set = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
      return (
        <TabShellModal title="Topic Flashcard" onClose={onClose}>
          <form onSubmit={e => { e.preventDefault(); onSave(form); }} class="space-y-4">
            <div class="grid grid-cols-4 gap-3">
              <input value={form.icon || ''} onChange={e => set('icon', e.target.value)} class="border rounded-2xl px-3 py-2 text-center" placeholder="Icon" />
              <input value={form.id || ''} onChange={e => set('id', slugifyText(e.target.value))} class="col-span-3 border rounded-2xl px-3 py-2 font-mono text-sm" placeholder="topic-id" disabled={Boolean(data.id)} />
            </div>
            <input value={form.title || ''} onChange={e => set('title', e.target.value)} class="w-full border rounded-2xl px-3 py-2 font-bold" placeholder="Tên topic" />
            <textarea value={form.description || ''} onChange={e => set('description', e.target.value)} class="w-full border rounded-2xl px-3 py-2 h-24" placeholder="Mô tả" />
            <div class="flex items-center gap-4">
              <input type="number" value={form.sort_order || 0} onChange={e => set('sort_order', e.target.value)} class="border rounded-2xl px-3 py-2 w-32" />
              <label class="flex items-center gap-2 text-sm font-bold text-gray-600"><input type="checkbox" checked={Boolean(form.is_published)} onChange={e => set('is_published', e.target.checked)} /> Published</label>
            </div>
            <button class="w-full bg-primary text-white font-bold py-3 rounded-2xl">Lưu topic</button>
          </form>
        </TabShellModal>
      );
    }

    function FlashcardCardModal({ data, onClose, onSave }) {
      const [form, setForm] = useState(data);
      const set = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
      return (
        <TabShellModal title="Thẻ Flashcard" onClose={onClose}>
          <form onSubmit={e => { e.preventDefault(); onSave(form); }} class="space-y-4">
            <input value={form.english || ''} onChange={e => set('english', e.target.value)} class="w-full border rounded-2xl px-3 py-2 font-bold" placeholder="English" />
            <input value={form.phonetic || ''} onChange={e => set('phonetic', e.target.value)} class="w-full border rounded-2xl px-3 py-2" placeholder="Phonetic (optional)" />
            <textarea value={form.vietnamese || ''} onChange={e => set('vietnamese', e.target.value)} class="w-full border rounded-2xl px-3 py-2 h-28" placeholder="Vietnamese" />
            <div class="grid grid-cols-2 gap-3">
              <select value={form.type || 'vocabulary'} onChange={e => set('type', e.target.value)} class="border rounded-2xl px-3 py-2">
                <option value="vocabulary">vocabulary</option>
                <option value="example">example</option>
              </select>
              <input type="number" value={form.sort_order || 0} onChange={e => set('sort_order', e.target.value)} class="border rounded-2xl px-3 py-2" placeholder="Sort order" />
            </div>
            <button class="w-full bg-primary text-white font-bold py-3 rounded-2xl">Lưu thẻ</button>
          </form>
        </TabShellModal>
      );
    }

    function TabBlog({ supabaseClient, showToast, units }) {
      const emptyPost = {
        id: '', slug: '', title: '', excerpt: '', content_markdown: '',
        author: 'Du Gia Văn', author_avatar: '🧑‍🏫', category: 'grammar',
        cover_emoji: '📝', cover_color: '#e8f5eb', difficulty: 'easy',
        reading_time: 3, tags: [], linked_unit_id: '', linked_flashcard_id: '',
        related_post_ids: [], is_featured: false, is_pinned: false,
        status: 'draft', published_at: null
      };
      const [posts, setPosts] = useState([]);
      const [activePost, setActivePost] = useState(null);
      const [filters, setFilters] = useState({ status: 'all', category: 'all', search: '' });
      const [saveStatus, setSaveStatus] = useState('saved');
      const saveTimer = useRef(null);

      useEffect(() => { fetchPosts(); return () => clearTimeout(saveTimer.current); }, []);

      const fetchPosts = async () => {
        const { data, error } = await supabaseClient
          .from('blog_posts')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) return showToast(error.message, 'error');
        setPosts(data || []);
      };

      const savePost = async (post, silent = false) => {
        const row = {
          ...post,
          id: post.id || slugifyText(post.title),
          slug: post.slug || slugifyText(post.title),
          reading_time: Number(post.reading_time || 3),
          tags: Array.isArray(post.tags) ? post.tags : String(post.tags || '').split(',').map(t => t.trim()).filter(Boolean),
          related_post_ids: Array.isArray(post.related_post_ids) ? post.related_post_ids : String(post.related_post_ids || '').split(',').map(t => t.trim()).filter(Boolean),
          linked_unit_id: post.linked_unit_id || null,
          linked_flashcard_id: post.linked_flashcard_id || null
        };
        setSaveStatus('saving');
        const { error } = await supabaseClient.from('blog_posts').upsert(row);
        if (error) {
          setSaveStatus('unsaved');
          return showToast(error.message, 'error');
        }
        setSaveStatus('saved');
        setActivePost(row);
        if (!silent) showToast('Đã lưu bài viết');
        fetchPosts();
      };

      const updatePost = (patch) => {
        setActivePost(prev => {
          const next = { ...prev, ...patch };
          clearTimeout(saveTimer.current);
          if (next.id) {
            setSaveStatus('unsaved');
            saveTimer.current = setTimeout(() => savePost(next, true), 1500);
          }
          return next;
        });
      };

      const togglePublish = async () => {
        if (!activePost) return;
        const nextStatus = activePost.status === 'published' ? 'draft' : 'published';
        await savePost({
          ...activePost,
          status: nextStatus,
          published_at: nextStatus === 'published' ? new Date().toISOString() : activePost.published_at
        });
      };

      const deletePost = async (post) => {
        if (!confirm(`Xóa bài "${post.title}"?`)) return;
        const { error } = await supabaseClient.from('blog_posts').delete().eq('id', post.id);
        if (error) return showToast(error.message, 'error');
        if (activePost?.id === post.id) setActivePost(null);
        showToast('Đã xóa bài viết');
        fetchPosts();
      };

      const visiblePosts = posts
        .filter(p => filters.status === 'all' || p.status === filters.status)
        .filter(p => filters.category === 'all' || p.category === filters.category)
        .filter(p => !filters.search || `${p.title} ${p.excerpt}`.toLowerCase().includes(filters.search.toLowerCase()));

      return (
        <div class="grid grid-cols-[360px_1fr] gap-6">
          <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-4 h-[calc(100vh-170px)] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-extrabold text-gray-700">Bài viết</h3>
              <button onClick={() => { setActivePost(emptyPost); setSaveStatus('unsaved'); }} class="bg-primary text-white px-3 py-2 rounded-2xl text-xs font-bold">+ Bài</button>
            </div>
            <div class="space-y-2 mb-4">
              <input value={filters.search} onChange={e => setFilters({ ...filters, search: e.target.value })} class="w-full border rounded-2xl px-3 py-2 text-xs" placeholder="Tìm theo tiêu đề..." />
              <div class="grid grid-cols-2 gap-2">
                <select value={filters.status} onChange={e => setFilters({ ...filters, status: e.target.value })} class="border rounded-2xl px-3 py-2 text-xs">
                  <option value="all">Tất cả</option><option value="draft">Draft</option><option value="published">Published</option>
                </select>
                <select value={filters.category} onChange={e => setFilters({ ...filters, category: e.target.value })} class="border rounded-2xl px-3 py-2 text-xs">
                  <option value="all">Mọi category</option><option value="grammar">grammar</option><option value="vocabulary">vocabulary</option><option value="tips">tips</option>
                </select>
              </div>
            </div>
            {visiblePosts.map(post => (
              <button key={post.id} onClick={() => setActivePost(post)} class={`w-full text-left p-3 rounded-2xl mb-2 border ${activePost?.id === post.id ? 'bg-emerald-50 border-primary/30' : 'bg-gray-50 border-transparent hover:bg-gray-100'}`}>
                <div class="flex gap-2">
                  <span class="text-2xl">{post.cover_emoji || '📝'}</span>
                  <div class="min-w-0">
                    <div class="font-extrabold text-sm text-gray-700 truncate">{post.title || 'Chưa có tiêu đề'}</div>
                    <div class="text-[11px] text-gray-400 font-bold">{post.status} · {post.category} {post.is_featured ? '· ⭐' : ''} {post.is_pinned ? '· 📌' : ''}</div>
                  </div>
                </div>
              </button>
            ))}
          </div>

          {!activePost ? (
            <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-12 text-center text-gray-400 font-bold">Chọn hoặc tạo một bài viết.</div>
          ) : (
            <div class="space-y-4">
              <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-4 flex items-center justify-between">
                <div>
                  <div class={`text-xs font-bold ${saveStatus === 'saved' ? 'text-emerald-600' : 'text-yellow-600'}`}>{saveStatus === 'saved' ? 'Đã lưu' : saveStatus === 'saving' ? 'Đang lưu...' : 'Chưa lưu'}</div>
                  <h3 class="font-extrabold text-gray-700">{activePost.title || 'Bài viết mới'}</h3>
                </div>
                <div class="flex gap-2">
                  <button onClick={togglePublish} class="bg-blue-50 text-blue-600 px-4 py-2 rounded-2xl text-xs font-bold">{activePost.status === 'published' ? 'Chuyển Draft' : 'Publish'}</button>
                  <button onClick={() => savePost(activePost)} class="bg-primary text-white px-4 py-2 rounded-2xl text-xs font-bold">Lưu ngay</button>
                  {activePost.id && <button onClick={() => deletePost(activePost)} class="bg-red-50 text-red-600 px-4 py-2 rounded-2xl text-xs font-bold">Xóa</button>}
                </div>
              </div>
              <div class="bg-white rounded-3xl border border-emerald-50 shadow-sm p-5 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                  <input value={activePost.title || ''} onChange={e => updatePost({ title: e.target.value, id: activePost.id || slugifyText(e.target.value), slug: activePost.slug || slugifyText(e.target.value) })} class="border rounded-2xl px-3 py-2 font-bold" placeholder="Tiêu đề" />
                  <input value={activePost.slug || ''} onChange={e => updatePost({ slug: slugifyText(e.target.value) })} class="border rounded-2xl px-3 py-2 font-mono text-sm" placeholder="slug" />
                </div>
                <textarea value={activePost.excerpt || ''} onChange={e => updatePost({ excerpt: e.target.value })} class="w-full border rounded-2xl px-3 py-2 h-20" placeholder="Tóm tắt bài viết" />
                <div class="grid grid-cols-4 gap-3">
                  <select value={activePost.category || 'grammar'} onChange={e => updatePost({ category: e.target.value })} class="border rounded-2xl px-3 py-2"><option value="grammar">grammar</option><option value="vocabulary">vocabulary</option><option value="tips">tips</option></select>
                  <input value={activePost.cover_emoji || ''} onChange={e => updatePost({ cover_emoji: e.target.value })} class="border rounded-2xl px-3 py-2 text-center" placeholder="Emoji" />
                  <input type="color" value={activePost.cover_color || '#e8f5eb'} onChange={e => updatePost({ cover_color: e.target.value })} class="border rounded-2xl px-3 py-2 h-11" />
                  <input type="number" value={activePost.reading_time || 3} onChange={e => updatePost({ reading_time: e.target.value })} class="border rounded-2xl px-3 py-2" placeholder="Phút đọc" />
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <input value={activePost.author || ''} onChange={e => updatePost({ author: e.target.value })} class="border rounded-2xl px-3 py-2" placeholder="Tác giả" />
                  <select value={activePost.linked_unit_id || ''} onChange={e => updatePost({ linked_unit_id: e.target.value })} class="border rounded-2xl px-3 py-2"><option value="">Không link unit</option>{units.map(u => <option key={u.id} value={u.id}>{u.title}</option>)}</select>
                  <input value={activePost.linked_flashcard_id || ''} onChange={e => updatePost({ linked_flashcard_id: e.target.value })} class="border rounded-2xl px-3 py-2" placeholder="flashcard topic id" />

    function TabSpeaking({ supabaseClient, showToast }) {
      const [topics, setTopics] = useState([]);
      const [subtopics, setSubtopics] = useState([]);
      const [sentences, setSentences] = useState([]);
      const [topic, setTopic] = useState(null);
      const [subtopic, setSubtopic] = useState(null);
      const [modal, setModal] = useState(null);
      const [importText, setImportText] = useState('');

      useEffect(() => { fetchTopics(); }, []);
      useEffect(() => { if (topic) fetchSubtopics(topic.id); }, [topic?.id]);
      useEffect(() => { if (subtopic) fetchSentences(subtopic.id); }, [subtopic?.id]);

      const fetchTopics = async () => {
        const { data, error } = await supabaseClient.from('speaking_topics').select('*').order('sort_order', { ascending: true });
        if (error) return showToast(error.message, 'error');
        setTopics(data || []);
      };
      const fetchSubtopics = async (topicId) => {
        const { data, error } = await supabaseClient.from('speaking_subtopics').select('*').eq('topic_id', topicId).order('sort_order', { ascending: true });
        if (error) return showToast(error.message, 'error');
        setSubtopics(data || []);
        setSubtopic(null);
        setSentences([]);
      };
      const fetchSentences = async (subtopicId) => {
        const { data, error } = await supabaseClient.from('speaking_sentences').select('*').eq('subtopic_id', subtopicId).order('sort_order', { ascending: true });
        if (error) return showToast(error.message, 'error');
        setSentences(data || []);
      };
      const saveTopic = async (row) => {
        const payload = { id: row.id, title: row.title, description: row.description || '', icon: row.icon || '🎙️', sort_order: Number(row.sort_order || 0) };
        const { error } = await supabaseClient.from('speaking_topics').upsert(payload);
        if (error) return showToast(error.message, 'error');
        setModal(null); showToast('Đã lưu speaking topic'); fetchTopics();
      };
      const saveSubtopic = async (row) => {
        const payload = { id: row.id, topic_id: topic.id, name: row.name, icon: row.icon || '🗣️', sort_order: Number(row.sort_order || 0) };
        const { error } = await supabaseClient.from('speaking_subtopics').upsert(payload);
        if (error) return showToast(error.message, 'error');
        setModal(null); showToast('Đã lưu subtopic'); fetchSubtopics(topic.id);
      };
      const saveSentence = async (row) => {
        const payload = { ...row, subtopic_id: subtopic.id, sort_order: Number(row.sort_order || 0) };
        const { error } = await supabaseClient.from('speaking_sentences').upsert(payload);
        if (error) return showToast(error.message, 'error');
        setModal(null); showToast('Đã lưu câu'); fetchSentences(subtopic.id);
      };
      const deleteRow = async (table, id, after) => {
        if (!confirm('Xóa mục này?')) return;
        const { error } = await supabaseClient.from(table).delete().eq('id', id);
        if (error) return showToast(error.message, 'error');
        showToast('Đã xóa');
        after();
      };
      const importSentences = async () => {
        try {
          const parsed = JSON.parse(importText);
          const arr = Array.isArray(parsed) ? parsed : parsed.sentences || [];
          const payload = arr.map((s, i) => ({
            subtopic_id: subtopic.id,
            text_en: s.text_en || s.text || '',
            text_vi: s.text_vi || s.vi || '',
            type: s.type || 'basic',
            sort_order: Number(s.sort_order ?? sentences.length + i + 1)
          })).filter(s => s.text_en && s.text_vi);
          if (payload.length === 0) throw new Error('Không có câu hợp lệ');
          const { error } = await supabaseClient.from('speaking_sentences').insert(payload);
          if (error) throw error;
          setImportText('');
          setModal(null);
          showToast(`Đã import ${payload.length} câu`);
          fetchSentences(subtopic.id);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      return (
        <div class="grid grid-cols-3 gap-5">
          <SpeakingColumn title="Topics" action="+ Topic" onAction={() => setModal({ type: 'topic', data: { id: '', title: '', description: '', icon: '🎙️', sort_order: topics.length + 1 } })}>
            {topics.map(item => (
              <button key={item.id} onClick={() => setTopic(item)} class={`w-full text-left p-3 rounded-2xl mb-2 ${topic?.id === item.id ? 'bg-emerald-50 text-primary' : 'bg-white hover:bg-gray-50'} border border-emerald-50`}>
                <div class="font-extrabold">{item.icon || '🎙️'} {item.title}</div>
                <div class="text-xs text-gray-400">{item.description}</div>
              </button>
            ))}
          </SpeakingColumn>
          <SpeakingColumn title={topic ? `Subtopics: ${topic.title}` : 'Subtopics'} action="+ Subtopic" onAction={() => topic && setModal({ type: 'subtopic', data: { id: '', name: '', icon: '🗣️', sort_order: subtopics.length + 1 } })}>
            {!topic && <div class="text-sm text-gray-400 font-bold">Chọn topic trước.</div>}
            {subtopics.map(item => (
              <button key={item.id} onClick={() => setSubtopic(item)} class={`w-full text-left p-3 rounded-2xl mb-2 ${subtopic?.id === item.id ? 'bg-emerald-50 text-primary' : 'bg-white hover:bg-gray-50'} border border-emerald-50`}>
                <div class="font-extrabold">{item.icon || '🗣️'} {item.name}</div>
              </button>
            ))}
          </SpeakingColumn>
          <SpeakingColumn title={subtopic ? `Sentences: ${subtopic.name}` : 'Sentences'} action="+ Câu" onAction={() => subtopic && setModal({ type: 'sentence', data: { text_en: '', text_vi: '', type: 'basic', sort_order: sentences.length + 1 } })}>
            {subtopic && <button onClick={() => setModal({ type: 'import' })} class="mb-3 w-full bg-blue-50 text-blue-600 py-2 rounded-2xl text-xs font-bold">Import JSON sentences</button>}
            {!subtopic && <div class="text-sm text-gray-400 font-bold">Chọn subtopic trước.</div>}
            {sentences.map(item => (
              <div key={item.id} class="bg-white border border-emerald-50 rounded-2xl p-3 mb-2">
                <div class="font-bold text-gray-700 text-sm">{item.text_en}</div>
                <div class="text-xs text-gray-500 mt-1">{item.text_vi}</div>
                <div class="flex gap-3 mt-2 text-xs font-bold">
                  <button onClick={() => setModal({ type: 'sentence', data: item })} class="text-blue-600">Sửa</button>
                  <button onClick={() => deleteRow('speaking_sentences', item.id, () => fetchSentences(subtopic.id))} class="text-red-600">Xóa</button>
                </div>
              </div>
            ))}
          </SpeakingColumn>

          {modal?.type === 'topic' && <SpeakingTopicModal data={modal.data} onClose={() => setModal(null)} onSave={saveTopic} onDelete={modal.data.id ? () => deleteRow('speaking_topics', modal.data.id, fetchTopics) : null} />}
          {modal?.type === 'subtopic' && <SpeakingSubtopicModal data={modal.data} onClose={() => setModal(null)} onSave={saveSubtopic} onDelete={modal.data.id ? () => deleteRow('speaking_subtopics', modal.data.id, () => fetchSubtopics(topic.id)) : null} />}
          {modal?.type === 'sentence' && <SpeakingSentenceModal data={modal.data} onClose={() => setModal(null)} onSave={saveSentence} />}
          {modal?.type === 'import' && (
            <TabShellModal title="Import Speaking Sentences" onClose={() => setModal(null)}>
              <textarea value={importText} onChange={e => setImportText(e.target.value)} class="w-full h-64 font-mono text-xs border rounded-2xl p-4" placeholder='[{"text":"Hello","vi":"Xin chào","type":"basic"}]' />
              <button onClick={importSentences} class="mt-4 w-full bg-primary text-white font-bold py-3 rounded-2xl">Import</button>
            </TabShellModal>
          )}
        </div>
      );
    }

    // Component: Command Palette search overlay
    function CommandPalette({ units, categories, onClose, onNavigate }) {
      const [query, setQuery] = useState('');
      const [selectedIndex, setSelectedIndex] = useState(0);
      const inputRef = useRef(null);

      useEffect(() => inputRef.current?.focus(), []);

      // Total list of items searchable
      const items = [
        ...categories.map(c => ({ label: `📁 ${c.title}`, type: 'category', sub: 'Danh mục', action: () => onNavigate('categories') })),
        ...units.map(u => ({
          label: `📘 ${u.title}`,
          type: 'unit',
          sub: categories.find(c => c.id === u.category_id)?.title || 'Bài học',
          action: () => onNavigate('units', u),
        })),
        { label: '➕ Thêm bài học mới', type: 'action', sub: 'Tác vụ', action: () => { onNavigate('units'); onClose(); setTimeout(() => window.cmsSetModal({ type: 'add_unit', data: null }), 100); } },
        { label: '➕ Thêm danh mục mới', type: 'action', sub: 'Tác vụ', action: () => { onNavigate('categories'); onClose(); setTimeout(() => window.cmsSetModal({ type: 'add_category', data: null }), 100); } },
      ];

      const filtered = query
        ? items.filter(i => i.label.toLowerCase().includes(query.toLowerCase()))
        : items.slice(0, 8);

      // Reset selection on search query change
      useEffect(() => {
        setSelectedIndex(0);
      }, [query]);

      // Handle keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSelectedIndex(prev => (prev + 1) % Math.max(1, filtered.length));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSelectedIndex(prev => (prev - 1 + filtered.length) % Math.max(1, filtered.length));
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (filtered[selectedIndex]) {
              filtered[selectedIndex].action();
              onClose();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [filtered, selectedIndex]);

      return (
        <div class="fixed inset-0 bg-black/60 flex items-start justify-center pt-[20vh] z-50 p-4" onClick={onClose}>
          <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-150" onClick={e => e.stopPropagation()}>
            <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-100">
              <span class="text-gray-400 text-xl">🔍</span>
              <input
                ref={inputRef}
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Tìm Unit, Category hoặc hành động..."
                class="flex-1 outline-none text-base font-semibold text-gray-700 bg-transparent"
              />
              <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded-lg font-mono">ESC</span>
            </div>
            <div class="max-h-80 overflow-y-auto py-2 custom-scrollbar">
              {filtered.length === 0 && (
                <div class="text-center py-8 text-gray-400 text-sm font-semibold">Không tìm thấy kết quả</div>
              )}
              {filtered.map((item, i) => (
                <button
                  key={i}
                  onClick={() => { item.action(); onClose(); }}
                  class={`w-full flex items-center justify-between px-5 py-3 text-left transition ${i === selectedIndex ? 'bg-emerald-50' : 'hover:bg-gray-50'}`}
                >
                  <span class={`text-sm font-bold ${i === selectedIndex ? 'text-primary' : 'text-gray-700'}`}>{item.label}</span>
                  {item.sub && <span class="text-xs text-gray-400 font-medium">{item.sub}</span>}
                </button>
              ))}
            </div>
            <div class="px-5 py-2.5 border-t border-gray-55 flex gap-4 text-[10px] text-gray-400 font-bold bg-gray-50/50">
              <span>↑↓ Di chuyển</span>
              <span>↵ Chọn</span>
              <span>ESC Đóng</span>
              <span class="ml-auto">Ctrl+K để đóng/mở</span>
            </div>
          </div>
        </div>
      );
    }
